# VerdictPay Render Blueprint — two Docker web services, no PayPal account needed.
#
#   Dashboard: New + > Blueprint > connect this repo > Apply.
#
# WHAT THIS FIXES vs the first draft
#   1. The API SEEDS ON BOOT. The seed lives in the backend image's own CMD
#      (backend/Dockerfile), not in a Render-only override, so 'docker run' and
#      every host behave identically and a fresh deploy never comes up with an
#      empty database.
#   2. Secrets are shared through one env group. The web service needs the same
#      VERDICTPAY_SIGNING_SECRET as the API, otherwise the server-side SDK route
#      signs telemetry with a different key and every ingest is rejected.
#      generateValue inside a group is generated once and shared by both.
#   3. CORS reads the web service's real public URL instead of a hardcoded host.
#      Render appends a suffix when a name is taken, which would otherwise make
#      ALLOWED_ORIGINS wrong and block every browser request.
#
# THE ONE THING YOU MUST CHECK
#   NEXT_PUBLIC_* is compiled into the browser bundle at BUILD time, so the web
#   service cannot discover the API URL at runtime. Keep the default service
#   names below and the value is correct. If Render reports either name as taken
#   it will append a suffix (for example verdictpay-api-a1b2), and you must:
#     - update NEXT_PUBLIC_API_BASE_URL  to the API's real https URL, and
#     - redeploy the web service (a restart is not enough; it must rebuild).
#
# STORAGE
#   Free plan has no persistent disk, so the SQLite file lives on the container
#   filesystem and resets on every deploy or restart. That is deliberate for a
#   judge demo: every visit starts from a freshly seeded, deterministic dataset.
#   For durable data, attach a paid disk mounted at /app/data, or point
#   DATABASE_URL at Postgres (add asyncpg to backend/pyproject.toml first —
#   it is not currently a dependency).

envVarGroups:
  - name: verdictpay-shared
    envVars:
      # Set this once in the dashboard; both services inherit it. Must NOT be
      # empty: the API refuses to boot in production with an empty or dev-prefixed
      # secret, by design.
      - key: VERDICTPAY_API_KEY
        sync: false
      # Generated once here and shared, so the API and the web signing route agree.
      - key: VERDICTPAY_SIGNING_SECRET
        generateValue: true
      - key: VERDICTPAY_WEBHOOK_SECRET
        generateValue: true

services:
  - type: web
    name: verdictpay-api
    runtime: docker
    plan: free
    region: oregon
    dockerfilePath: ./backend/Dockerfile
    dockerContext: .
    healthCheckPath: /api/v1/health
    autoDeploy: true
    envVars:
      - fromGroup: verdictpay-shared
      - key: APP_ENV
        value: production
      - key: DEMO_MODE
        value: "true"
      - key: DATABASE_URL
        value: sqlite+aiosqlite:////app/data/verdictpay.db
      # PAYPAL_MODE must be PAYPAL_SANDBOX for a judge to see real PayPal
      # activity. It previously said "simulator", which is why the public
      # deployment reported "Gateway: simulator" while the credentials below
      # were already configured. Set to LOCAL_SIMULATOR to run keyless.
      - key: PAYPAL_MODE
        value: PAYPAL_SANDBOX
      # Real money never moves: PAYPAL_LIVE additionally requires this flag.
      - key: ALLOW_PAYPAL_LIVE
        value: "false"
      # Where PayPal returns the buyer after approving. Leave empty to fall back
      # to the gateway's default deep link.
      - key: PAYPAL_RETURN_URL
        sync: false
      - key: PAYPAL_CANCEL_URL
        sync: false
      - key: LLM_MODE
        value: gemini
      - key: GEMINI_MODEL
        value: gemini-2.5-flash
      - key: GEMINI_API_KEY
        sync: false
      - key: AI_ENABLED
        value: "true"
      - key: ALLOW_UNSIGNED_WEBHOOKS
        value: "false"
      # The web service's real public URL, whatever suffix Render gave it.
      - key: ALLOWED_ORIGINS
        fromService:
          name: verdictpay-web
          type: web
          envVarKey: RENDER_EXTERNAL_URL
      - key: PAYPAL_CLIENT_ID
        sync: false
      - key: PAYPAL_CLIENT_SECRET
        sync: false
      - key: PAYPAL_WEBHOOK_ID
        sync: false
      - key: OPENAI_API_KEY
        sync: false

  - type: web
    name: verdictpay-web
    runtime: docker
    plan: free
    region: oregon
    dockerfilePath: ./frontend/Dockerfile
    dockerContext: .
    healthCheckPath: /
    autoDeploy: true
    envVars:
      - fromGroup: verdictpay-shared
      # Build-time value (see the note at the top). Runtime value for the
      # server-side signing route, which prefers VERDICTPAY_API_BASE_URL.
      - key: NEXT_PUBLIC_API_BASE_URL
        value: https://verdictpay-api.onrender.com
      - key: VERDICTPAY_API_BASE_URL
        value: https://verdictpay-api.onrender.com
      # The browser sends this as X-API-Key. It is public by design for the demo.
      - key: NEXT_PUBLIC_VERDICTPAY_API_KEY
        sync: false
